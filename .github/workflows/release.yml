name: Release

# Corta uma versão semântica a partir da branch escolhida (use main).
# patch = correção, minor = feature, major = quebra, current = taga o número já no package.json.
# A main exige PR: o bump vai por um PR, espera o CI, mergeia, e só então cria a tag.
# Depois da tag, dispara o deploy na main (o Pages só publica a partir dela).

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Tipo de versão
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - current
        default: patch

permissions:
  contents: write
  actions: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Bump version through a PR
        if: ${{ inputs.bump != 'current' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          npm version "${{ inputs.bump }}" --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          BRANCH="release/v$VERSION"
          git checkout -b "$BRANCH"
          git add package.json package-lock.json
          git commit -m "chore(release): v$VERSION"
          git push -u origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --title "chore(release): v$VERSION" --body "Bump automático do workflow Release."
          # O check ainda não existe no primeiro segundo.
          sleep 20
          gh pr checks --watch --fail-fast
          gh pr merge --squash --delete-branch --subject "chore(release): v$VERSION"
          git fetch origin main
          git checkout -B main origin/main
      - name: Tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" --generate-notes --title "v$VERSION"
      - name: Deploy site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run "Deploy to GitHub Pages" --ref main
