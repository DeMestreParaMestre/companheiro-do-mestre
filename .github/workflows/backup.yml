name: Backup do banco

on:
  schedule:
    - cron: '0 6 * * *' # 03:00 em Brasília
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Conferir secrets
        run: |
          if [ -z "$DB_URL" ] || [ -z "$PASSPHRASE" ]; then
            echo "::error::Configure os secrets SUPABASE_DB_URL e BACKUP_PASSPHRASE."
            exit 1
          fi

      # O pg_dump precisa ser da mesma versão do servidor ou mais novo.
      - name: Instalar cliente PostgreSQL 17
        run: |
          sudo apt-get install -y -qq postgresql-common > /dev/null
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y > /dev/null
          sudo apt-get install -y -qq postgresql-client-17 > /dev/null
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      # Dados das contas primeiro: as tabelas do app referenciam auth.users.
      # O conteúdo das imagens fica no Storage e não entra aqui.
      - name: Gerar dump
        run: |
          set -euo pipefail
          export PGCONNECT_TIMEOUT=30
          {
            echo "-- Backup Companheiro do Mestre — $(date -u +%FT%TZ)"
            echo "-- 1) Contas (somente dados)"
            pg_dump "$DB_URL" --data-only --no-owner --table=auth.users --table=auth.identities
            echo "-- 2) Esquema public (estrutura + dados)"
            pg_dump "$DB_URL" --schema=public --no-owner
          } | gzip -9 > backup.sql.gz
          echo "Tamanho compactado: $(du -h backup.sql.gz | cut -f1)"
          if [ "$(gunzip -c backup.sql.gz | grep -c 'COPY public.campaigns ')" -eq 0 ]; then
            echo "::error::O dump não contém a tabela public.campaigns."
            exit 1
          fi

      - name: Criptografar
        run: |
          set -euo pipefail
          printf '%s' "$PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 -o backup.sql.gz.gpg backup.sql.gz
          shred -u backup.sql.gz
          echo "STAMP=$(date -u +%F)" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: backup-${{ env.STAMP }}
          path: backup.sql.gz.gpg
          retention-days: 90
          if-no-files-found: error
