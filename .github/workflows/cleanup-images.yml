name: Limpeza de imagens órfãs

on:
  schedule:
    - cron: '0 7 * * 0' # domingo 04:00 em Brasília
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cleanup-images
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v7

      - name: Conferir secret
        run: |
          if [ -z "$DB_URL" ]; then
            echo "::error::Configure o secret SUPABASE_DB_URL."
            exit 1
          fi

      - name: Instalar cliente PostgreSQL 17
        run: |
          sudo apt-get install -y -qq postgresql-common > /dev/null
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y > /dev/null
          sudo apt-get install -y -qq postgresql-client-17 > /dev/null
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      # Aplica a função (pode rodar de novo) e apaga só o que nenhuma campanha usa.
      - name: Limpar órfãs
        run: |
          set -euo pipefail
          export PGCONNECT_TIMEOUT=30
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/0007_cleanup_orphan_images.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "select removed as imagens_apagadas from public.cleanup_orphan_images();"
